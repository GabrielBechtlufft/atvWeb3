<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" href="https://www.cps.sp.gov.br/favicon.ico" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>DSM | Home</title>
      <link rel="stylesheet" href="/assets/css/main.css" />
   </head>
   <body>
      <main class="card">
         <h1 class="title">Login</h1>
         <form class="auth-form" action="#" method="post">
            <label for="email">E-mail</label>
            <input type="email" required id="email"/>

            <label for="senha">Senha</label>
            <input type="password" required id="senha"/>
         </form>
         <div class="actions">
            <button class="btn-link">Entrar</button>
            <a href="/cadastro" class="btn-link">Ir para cadastro</a>
            <a href="/" class="btn-link btn-secondary">Voltar</a>
         </div>
      </main>
   </body>
</html>
